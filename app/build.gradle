plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.soundwave.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soundwave.mobile'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        pip { install 'yt-dlp>=2026.3.17' }
    }
}
